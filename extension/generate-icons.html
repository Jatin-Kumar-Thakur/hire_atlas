<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Extension Icons</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f9fafb; }
    h2 { margin-bottom: 8px; }
    p  { color: #6b7280; margin-bottom: 16px; }
    canvas { display: none; }
    .previews { display: flex; gap: 16px; align-items: flex-end; margin: 16px 0; }
    .preview { text-align: center; font-size: 12px; color: #6b7280; }
    button { padding: 10px 20px; background: #3b82f6; color: white; border: none;
             border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    button:hover { background: #2563eb; }
    .note { margin-top: 16px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <h2>Generate Extension Icons</h2>
  <p>Opens download prompts for all 4 icon sizes. Move the downloaded files into <code>extension/icons/</code>.</p>

  <div class="previews" id="previews"></div>

  <button onclick="generateAll()">&#8681; Download All Icons</button>

  <p class="note">
    Files to save:<br/>
    icon16.png → extension/icons/icon16.png<br/>
    icon32.png → extension/icons/icon32.png<br/>
    icon48.png → extension/icons/icon48.png<br/>
    icon128.png → extension/icons/icon128.png
  </p>

  <canvas id="c"></canvas>

  <script>
    const SIZES = [16, 32, 48, 128];

    function makeIcon(size) {
      const canvas = document.getElementById('c');
      canvas.width  = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Blue rounded-rect background
      const r = Math.round(size * 0.18);
      ctx.fillStyle = '#3B82F6';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, r);
      ctx.fill();

      // White "JT" text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${Math.round(size * 0.42)}px Arial, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('JT', size / 2, size / 2 + size * 0.03);

      return canvas.toDataURL('image/png');
    }

    function generateAll() {
      SIZES.forEach((size) => {
        const dataUrl = makeIcon(size);
        const a = document.createElement('a');
        a.href     = dataUrl;
        a.download = `icon${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }

    // Show preview on load
    window.addEventListener('load', () => {
      const container = document.getElementById('previews');
      SIZES.forEach((size) => {
        const dataUrl = makeIcon(size);
        const div = document.createElement('div');
        div.className = 'preview';
        div.innerHTML = `<img src="${dataUrl}" width="${Math.min(size, 64)}" height="${Math.min(size, 64)}" style="border-radius:${Math.round(size*0.18)}px" /><br/>${size}×${size}`;
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
