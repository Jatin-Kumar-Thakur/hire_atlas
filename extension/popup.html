<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 220px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    .header {
      background: #4f46e5;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 18px; }
    .header h1  { font-size: 15px; font-weight: 700; color: #fff; }

    .content { padding: 14px 16px; }

    .status {
      font-size: 12px;
      color: #6b7280;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.detected {
      color: #059669;
      background: #ecfdf5;
      border-color: #6ee7b7;
    }

    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #111827;
    }
    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79,70,229,.15);
    }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary  { background: #4f46e5; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4338ca; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-ghost {
      background: #fff;
      color: #4f46e5;
      border: 1px solid #4f46e5;
      margin-top: 8px;
    }
    .btn-ghost:hover { background: #eef2ff; }

    .not-logged-in { text-align: center; padding: 24px 0; }
    .not-logged-in .lock-icon { font-size: 32px; margin-bottom: 10px; }
    .not-logged-in p { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.5; }

    #message {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    #message.success { background: #ecfdf5; color: #059669; display: block; }
    #message.error   { background: #fef2f2; color: #dc2626; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">💼</span>
    <h1>Job Tracker</h1>
  </div>

  <div class="content" id="main-content">
    <div class="status">Loading…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
